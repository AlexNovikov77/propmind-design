name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pages and JavaScript
        run: python3 scripts/check_site.py
      - name: Test registry rules and safe import
        run: node --test tests/registry.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development browser
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx --no-install playwright install --with-deps chromium
      - name: Check desktop and mobile interactions
        run: |
          python3 scripts/serve.py > /tmp/propmind-server.log 2>&1 &
          node scripts/browser-smoke.mjs
          node scripts/showcase-room.mjs
      - name: Save synthetic-data screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: |
            artifacts/*.png
            artifacts/showcase/*.png
          if-no-files-found: ignore
          retention-days: 7
