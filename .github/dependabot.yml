version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      browser-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
